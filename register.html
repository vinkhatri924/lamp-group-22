<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Periodic Table Color App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f4;
        }

        .register-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.12);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 16px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #7fd3e6;
        }
        button:hover {
            background-color: #66c5da;
        }

        #loginResult {
            margin-top: 15px;
            color: red;
            min-height: 20px;
        }

        .color-bar {
            display: flex;
            height: 8px;
            margin-bottom: 25px;
            border-radius: 5px;
            overflow: hidden;
        }

        .color-bar div {
            flex: 1;
        }

        .red { background-color: #ff6b6b; }
        .orange { background-color: #f7b267; }
        .yellow { background-color: #f6e05e; }
        .green { background-color: #78d5b0; }
        .blue { background-color: #7fd3e6; }
        .purple { background-color: #b28cff; }
        .pink { background-color: #ee8fbd; }
    </style>
</head>

<body>

<div class="register-container">

    <div class="color-bar">
        <div class="red"></div>
        <div class="orange"></div>
        <div class="yellow"></div>
        <div class="green"></div>
        <div class="blue"></div>
        <div class="purple"></div>
        <div class="pink"></div>
    </div>

    <h1>Periodic Table Color App</h1>

    <p class="subtitle">
        Please enter your information to Register
    </p>
    <form onsubmit="doRegister(); return false;">
    
        <input
            type="text"
            id="firstName"
            placeholder="First Name"
            required
        >
    
        <input
            type="text"
            id="lastName"
            placeholder="Last Name"
            required
        >
    
        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d@$!%*?&]{8,}"
            title="One uppercase letter, one lowercase letter, one number, and be at least 8 characters."
            required
        >
        <button type="submit">Register</button>
    </form>

    <p id="registerResult"></p>

</div>

<script src="js/code.js"></script>

</body>

</html>
